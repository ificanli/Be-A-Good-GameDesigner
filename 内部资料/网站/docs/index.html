async function openArticle(file,keepPosition=false){currentFile=file;let meta=files.find(x=>x[0]===file);if(meta)currentSeries=meta[1];cards.hidden=true;document.querySelector('.toolbar').hidden=true;reader.hidden=false;reader.innerHTML='<p>Loading…</p>';let r=await fetch(encodeURI(file));let text=await r.text();text=text.replace(/^---[\s\S]*?---\s*/,'');reader.innerHTML=readerNavigation()+'<div class="note-tools"><button id="showNotes">查看批注</button><button id="exportNotes">导出给作者</button><button id="importNotes">导入批注</button><span id="noteCount" class="note-count"></span></div>'+marked.parse(text);if(window.renderMathInElement){renderMathInElement(reader,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false})}let list=currentArticleList(),index=list.findIndex(x=>x[0]===file);reader.querySelector('.nav-back').onclick=closeArticle;reader.querySelector('.nav-prev').onclick=()=>index>0&&openArticle(list[index-1][0]);reader.querySelector('.nav-next').onclick=()=>index<list.length-1&&openArticle(list[index+1][0]);reader.querySelector('.nav-jump').onchange=e=>openArticle(decodeURIComponent(e.target.value));reader.querySelector('.nav-notes').onclick=openDrawer;reader.querySelector('#showNotes').onclick=openDrawer;reader.querySelector('#exportNotes').onclick=exportNotes;reader.querySelector('#importNotes').onclick=()=>document.querySelector('#noteImport').click();refreshNotes();if(!keepPosition){let top=reader.getBoundingClientRect().top+window.scrollY-12;window.scrollTo({top,behavior:'smooth'})}}

function rangeAt(start,end,map){let a=map.nodes.find(x=>x.start<=start&&x.end>=start),b=map.nodes.find(x=>x.start<end&&x.end>=end);if(!a||!b)return null;let range=new Range();range.setStart(a.node,start-a.start);range.setEnd(b.node,end-b.start);return range}
