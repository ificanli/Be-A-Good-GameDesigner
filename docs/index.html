<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=IBM+Plex+Sans+TC:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
:root{--ink:#17211f;--muted:#697773;--paper:#f3f5ef;--card:#fbfcf7;--line:#d8ded3;--acid:#c8f169;--orange:#ff704b;--deep:#173c37}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans TC',sans-serif}body:before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.3;background-image:radial-gradient(#9aa99f 0.6px,transparent .6px);background-size:12px 12px}.shell{max-width:1280px;margin:auto;padding:28px 38px 80px;position:relative}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:18px}.brand{font:600 14px 'DM Mono';letter-spacing:.08em}.mark{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--orange);margin-right:9px;box-shadow:18px 0 var(--acid)}.status{font:12px 'DM Mono';color:var(--muted)}.hero{padding:82px 0 72px;display:grid;grid-template-columns:1.25fr .75fr;gap:70px;align-items:end}.eyebrow{font:12px 'DM Mono';color:var(--orange);letter-spacing:.1em;text-transform:uppercase}.hero h1{font:700 clamp(48px,8vw,112px);line-height:.94;letter-spacing:-.075em;margin:18px 0 28px;max-width:850px}.hero h1 em{font-style:normal;color:var(--deep);text-decoration:underline;text-decoration-thickness:7px;text-decoration-color:var(--acid);text-underline-offset:8px}.hero p{font-size:18px;line-height:1.75;max-width:620px;color:#4f5e59}.signal{background:var(--deep);color:#edf6e7;padding:26px;transform:rotate(2deg);box-shadow:12px 12px 0 var(--acid)}.signal b{font:700 29px 'Space Grotesk';display:block;margin-bottom:18px}.signal span{display:block;color:#b9ccc0;line-height:1.7}.grid{display:grid;grid-template-columns:250px 1fr;gap:42px}.side{border-top:2px solid var(--ink);padding-top:16px}.side h3{font:600 13px 'DM Mono';margin:0 0 18px}.nav button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);padding:12px 0;background:none;color:var(--muted);font:500 14px inherit;cursor:pointer}.nav button:hover,.nav button.active{color:var(--orange);padding-left:8px}.content{min-width:0}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;border-bottom:2px solid var(--ink);padding-bottom:14px}.toolbar h2{font-size:24px;margin:0}.search{border:1px solid var(--line);background:var(--card);padding:10px 13px;width:230px;font:14px inherit}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);padding:23px;min-height:180px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-4px);border-color:var(--orange);box-shadow:5px 5px 0 var(--orange)}.tag{font:11px 'DM Mono';color:var(--orange)}.card h3{font-size:20px;line-height:1.35;margin:12px 0 8px}.card p{color:var(--muted);font-size:13px;line-height:1.6;margin:0}.card small{font:11px 'DM Mono';color:#95a19c;margin-top:17px}.reader{background:var(--card);border:1px solid var(--line);padding:clamp(24px,5vw,64px);max-width:900px;line-height:1.85}.reader h1{font-size:42px;line-height:1.15;letter-spacing:-.04em}.reader h2{margin-top:42px;border-left:5px solid var(--acid);padding-left:14px}.reader h3{margin-top:30px}.reader blockquote{border-left:3px solid var(--orange);padding-left:18px;color:var(--muted);margin-left:0}.reader code{font-family:'DM Mono';font-size:.86em;background:#edf0e8;padding:2px 5px}.reader pre{background:var(--deep);color:#edf6e7;padding:18px;overflow:auto}.reader table{border-collapse:collapse;width:100%;display:block;overflow:auto}.reader th,.reader td{border:1px solid var(--line);padding:9px 12px;text-align:left}.back{border:0;background:none;font:12px 'DM Mono';color:var(--orange);cursor:pointer;margin-bottom:20px}.footer{margin-top:80px;padding-top:18px;border-top:1px solid var(--line);font:11px 'DM Mono';color:var(--muted);display:flex;justify-content:space-between}@media(max-width:800px){.shell{padding:20px}.hero{grid-template-columns:1fr;padding:55px 0 48px;gap:35px}.hero h1{font-size:64px}.grid{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.toolbar{align-items:flex-start;gap:14px;flex-direction:column}.search{width:100%}.signal{transform:none}.reader h1{font-size:32px}}
</style></head>
<body><main class="shell"><header class="top"><div class="brand"><i class="mark"></i>GAME DESIGN LOGIC</div><div class="status">OPEN KNOWLEDGE BASE / 2026</div></header>
<section class="hero"><div><div class="eyebrow">A living archive for game makers</div><h1>把设计想法，<em>变成系统。</em></h1><p>游戏设计不是灵感堆砌。这里收集理论、数值、机制、关卡与案例，把模糊的“感觉”拆成可以讨论、验证和迭代的规则。</p></div><div class="signal"><b>01 → 17</b><span>从战斗公式到版本迁移<br>一篇教程，拆成一套工作流</span></div></section>
<div class="grid"><aside class="side"><h3>INDEX / 目录</h3><nav class="nav"><button class="active" data-filter="全部">全部文章</button><button data-filter="数值">数值与经济</button><button data-filter="系统">系统设计</button><button data-filter="战斗">战斗设计</button><button data-filter="资料">资料来源</button></nav></aside><section class="content"><div class="toolbar"><h2 id="heading">所有文章</h2><input id="search" class="search" placeholder="搜索文章…"></div><div id="cards" class="cards"></div><article id="reader" class="reader" hidden></article></section></div>
<footer class="footer"><span>持续积累 · 独立思考 · 公开分享</span><span>CONTENT IS A SYSTEM</span></footer></main>
<script>
const files=[
['05_数值与经济/数值设计不是填表-从目标到回滚的完整闭环.md','数值','数值设计不是填表','从目标定义到线上观测与回滚的六阶段闭环'],
['04_战斗设计/战斗数值设计-从伤害公式到TTK验证.md','战斗','战斗数值设计','从伤害公式、技能循环到 TTK 与分布验证'],
['03_系统设计/角色成长与等级设计-从经验曲线到长期通胀.md','系统','角色成长与等级设计','经验曲线、生命周期、追赶与长期通胀'],
['03_系统设计/装备与道具设计-从随机词缀到强化经济.md','系统','装备与道具设计','从随机词缀、强化成本到装备经济循环'],
['03_系统设计/技能与天赋设计-从单技能价值到Build多样性.md','系统','技能与天赋设计','技能循环、连携网络与 Build 多样性'],
['05_数值与经济/游戏数值策划教程-章节凝练索引.md','资料','教程章节凝练索引','17 章知识地图与阅读路线'],
['99_资料来源/游戏数值策划完全教程-资料卡.md','资料','《游戏数值策划完全教程》资料卡','来源、可信度、版权边界与交叉核验清单'],
['游戏设计资料索引.md','资料','第一轮互联网资料索引','游戏设计理论、经济、关卡、叙事与 UX 来源地图']];
const cards=document.querySelector('#cards'),reader=document.querySelector('#reader'),heading=document.querySelector('#heading');let filter='全部';
function draw(){let q=document.querySelector('#search').value.toLowerCase();cards.innerHTML=files.filter(x=>(filter==='全部'||x[1]===filter)&&(!q||x[2].toLowerCase().includes(q)||x[3].toLowerCase().includes(q))).map((x,i)=>`<div class="card" data-file="${encodeURIComponent(x[0])}"><div><span class="tag">${x[1]} / NOTE ${String(i+1).padStart(2,'0')}</span><h3>${x[2]}</h3><p>${x[3]}</p></div><small>READ ARTICLE ↗</small></div>`).join('');document.querySelectorAll('.card').forEach(c=>c.onclick=()=>openArticle(decodeURIComponent(c.dataset.file)))}
async function openArticle(file){cards.hidden=true;document.querySelector('.toolbar').hidden=true;reader.hidden=false;reader.innerHTML='<button class="back">← BACK TO INDEX</button><p>Loading…</p>';let r=await fetch(encodeURI(file));let text=await r.text();text=text.replace(/^---[\s\S]*?---\s*/,'');reader.innerHTML='<button class="back">← BACK TO INDEX</button>'+marked.parse(text);reader.querySelector('.back').onclick=closeArticle;window.scrollTo({top:0,behavior:'smooth'})}
function closeArticle(){reader.hidden=true;cards.hidden=false;document.querySelector('.toolbar').hidden=false}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;heading.textContent=filter==='全部'?'所有文章':filter+'相关';draw()});document.querySelector('#search').oninput=draw;draw();
</script></body></html>
