<!doctype html>
<html lang="zh-CN">
<head>

<title>游戏设计逻辑 · Design Systems Archive</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=IBM+Plex+Sans+TC:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
:root{--ink:#17211f;--muted:#697773;--paper:#f3f5ef;--card:#fbfcf7;--line:#d8ded3;--acid:#c8f169;--orange:#ff704b;--deep:#173c37}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans TC',sans-serif}body:before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.3;background-image:radial-gradient(#9aa99f 0.6px,transparent .6px);background-size:12px 12px}.shell{max-width:1280px;margin:auto;padding:28px 38px 80px;position:relative}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:18px}.brand{font:600 14px 'DM Mono';letter-spacing:.08em}.mark{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--orange);margin-right:9px;box-shadow:18px 0 var(--acid)}.status{font:12px 'DM Mono';color:var(--muted)}.hero{padding:82px 0 72px;display:grid;grid-template-columns:1.25fr .75fr;gap:70px;align-items:end}.eyebrow{font:12px 'DM Mono';color:var(--orange);letter-spacing:.1em;text-transform:uppercase}.hero h1{font:700 clamp(48px,8vw,112px);line-height:.94;letter-spacing:-.075em;margin:18px 0 28px;max-width:850px}.hero h1 em{font-style:normal;color:var(--deep);text-decoration:underline;text-decoration-thickness:7px;text-decoration-color:var(--acid);text-underline-offset:8px}.hero p{font-size:18px;line-height:1.75;max-width:620px;color:#4f5e59}.signal{background:var(--deep);color:#edf6e7;padding:26px;transform:rotate(2deg);box-shadow:12px 12px 0 var(--acid)}.signal b{font:700 29px 'Space Grotesk';display:block;margin-bottom:18px}.signal span{display:block;color:#b9ccc0;line-height:1.7}.grid{display:grid;grid-template-columns:250px 1fr;gap:42px}.side{border-top:2px solid var(--ink);padding-top:16px}.side h3{font:600 13px 'DM Mono';margin:0 0 18px}.nav button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);padding:12px 0;background:none;color:var(--muted);font:500 14px inherit;cursor:pointer}.nav button:hover,.nav button.active{color:var(--orange);padding-left:8px}.content{min-width:0}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;border-bottom:2px solid var(--ink);padding-bottom:14px}.toolbar h2{font-size:24px;margin:0}.search{border:1px solid var(--line);background:var(--card);padding:10px 13px;width:230px;font:14px inherit}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);padding:23px;min-height:180px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-4px);border-color:var(--orange);box-shadow:5px 5px 0 var(--orange)}.tag{font:11px 'DM Mono';color:var(--orange)}.card h3{font-size:20px;line-height:1.35;margin:12px 0 8px}.card p{color:var(--muted);font-size:13px;line-height:1.6;margin:0}.card small{font:11px 'DM Mono';color:#95a19c;margin-top:17px}.reader{background:var(--card);border:1px solid var(--line);padding:clamp(24px,5vw,64px);max-width:900px;line-height:1.85}.reader h1{font-size:42px;line-height:1.15;letter-spacing:-.04em}.reader h2{margin-top:42px;border-left:5px solid var(--acid);padding-left:14px}.reader h3{margin-top:30px}.reader blockquote{border-left:3px solid var(--orange);padding-left:18px;color:var(--muted);margin-left:0}.reader code{font-family:'DM Mono';font-size:.86em;background:#edf0e8;color:#24332f;padding:2px 5px}.reader pre{background:var(--deep);color:#f2ffe7;padding:22px 24px;overflow:auto;border-left:6px solid var(--acid);box-shadow:5px 5px 0 #dfe6d7;line-height:1.85}.reader pre code{display:block;background:transparent;color:inherit;padding:0;font-size:14px;white-space:pre;letter-spacing:.01em}.reader table{border-collapse:collapse;width:100%;display:block;overflow:auto}.reader th,.reader td{border:1px solid var(--line);padding:9px 12px;text-align:left}.back{border:0;background:none;font:12px 'DM Mono';color:var(--orange);cursor:pointer;margin-bottom:20px}.footer{margin-top:80px;padding-top:18px;border-top:1px solid var(--line);font:11px 'DM Mono';color:var(--muted);display:flex;justify-content:space-between}.select-note{position:fixed;z-index:30;border:0;background:var(--ink);color:white;padding:9px 14px;font:12px 'DM Mono';box-shadow:4px 4px 0 var(--acid);cursor:pointer}.note-tools{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 28px;padding:13px;background:#edf0e8;border-left:4px solid var(--acid)}.note-tools button,.note-modal button,.note-drawer button{border:1px solid var(--ink);background:var(--card);padding:8px 11px;font:12px 'IBM Plex Sans TC';cursor:pointer}.note-tools button:hover,.note-modal button:hover,.note-drawer button:hover{background:var(--acid)}.note-count{font:12px 'DM Mono';margin:auto 0 auto auto;color:var(--muted)}.note-drawer{position:fixed;z-index:40;top:0;right:0;width:min(430px,94vw);height:100vh;background:var(--card);border-left:2px solid var(--ink);box-shadow:-12px 0 0 rgba(23,60,55,.12);padding:24px;overflow:auto}.note-drawer-head{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--ink);padding-bottom:12px}.note-list{display:grid;gap:12px;margin-top:18px}.note-item{border:1px solid var(--line);padding:14px;background:#f6f8f1}.note-item blockquote{margin:0 0 10px;padding-left:10px;border-left:3px solid var(--orange);font-size:13px;color:var(--muted)}.note-item p{margin:0 0 12px;line-height:1.6}.note-actions{display:flex;gap:7px}.note-modal{border:0;padding:0;background:transparent}.note-modal::backdrop{background:rgba(17,30,27,.58)}.note-form{width:min(620px,92vw);background:var(--card);border:2px solid var(--ink);padding:25px;box-shadow:10px 10px 0 var(--acid)}.note-form h3{margin:0 0 15px}.selected-quote{max-height:130px;overflow:auto;background:#edf0e8;border-left:4px solid var(--orange);padding:12px;font-size:13px;color:var(--muted)}.note-form textarea{display:block;width:100%;min-height:150px;resize:vertical;margin:16px 0;padding:12px;border:1px solid var(--line);font:15px/1.65 'IBM Plex Sans TC'}.note-form-actions{display:flex;justify-content:flex-end;gap:9px}::highlight(game-notes){background:rgba(255,214,75,.6);text-decoration:underline;text-decoration-color:var(--orange);text-decoration-thickness:2px}@media(max-width:800px){.shell{padding:20px}.hero{grid-template-columns:1fr;padding:55px 0 48px;gap:35px}.hero h1{font-size:64px}.grid{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.toolbar{align-items:flex-start;gap:14px;flex-direction:column}.search{width:100%}.signal{transform:none}.reader h1{font-size:32px}.note-count{width:100%;margin:4px 0 0}}
</style></head>
<body><main class="shell"><header class="top"><div class="brand"><i class="mark"></i>GAME DESIGN LOGIC</div><div class="status">OPEN KNOWLEDGE BASE / 2026</div></header>
<section class="hero"><div><div class="eyebrow">A living archive for game makers</div><h1>把设计想法，<em>变成系统。</em></h1><p>游戏设计不是灵感堆砌。这里收集理论、数值、机制、关卡与案例，把模糊的“感觉”拆成可以讨论、验证和迭代的规则。</p></div><div class="signal"><b>01 → 17</b><span>从战斗公式到版本迁移<br>一篇教程，拆成一套工作流</span></div></section>
<div class="grid"><aside class="side"><h3>INDEX / 目录</h3><nav class="nav"><button class="active" data-filter="全部">全部文章</button><button data-filter="数值">数值与经济</button><button data-filter="系统">系统设计</button><button data-filter="战斗">战斗设计</button><button data-filter="资料">资料来源</button></nav></aside><section class="content"><div class="toolbar"><h2 id="heading">所有文章</h2><input id="search" class="search" placeholder="搜索文章…"></div><div id="cards" class="cards"></div><article id="reader" class="reader" hidden></article></section></div>
<footer class="footer"><span>持续积累 · 独立思考 · 公开分享</span><span>CONTENT IS A SYSTEM</span></footer></main>
<button id="selectNote" class="select-note" hidden>＋ 批注</button>
<aside id="noteDrawer" class="note-drawer" hidden><div class="note-drawer-head"><strong>文章批注</strong><button id="closeDrawer">关闭</button></div><div id="noteList" class="note-list"></div></aside>
<dialog id="noteModal" class="note-modal"><form id="noteForm" class="note-form" method="dialog"><h3>添加批注</h3><div id="selectedQuote" class="selected-quote"></div><textarea id="noteText" placeholder="说明哪里有问题、希望怎样修改，或直接写出替代表述……" required></textarea><div class="note-form-actions"><button value="cancel" formnovalidate>取消</button><button id="saveNote" value="default">保存批注</button></div></form></dialog>
<input id="noteImport" type="file" accept="application/json,.json" hidden>
<script>
const files=[
['05_数值与经济/数值设计不是填表-从目标到回滚的完整闭环.md','数值','数值建模：从体验目标到标准模型','从战斗时间、等级函数和标准属性建立可验证的系统强度预算'], 
['05_数值与经济/强化概率-从状态转移到期望成本.md','数值','强化概率：从状态转移到期望成本','失败回退、期望成本、坏尾部、保底与保护道具验证'],
['04_战斗设计/战斗数值设计-从伤害公式到TTK验证.md','战斗','战斗数值设计','从伤害公式、技能循环到 TTK 与分布验证'],
['03_系统设计/角色成长与等级设计-从经验曲线到长期通胀.md','系统','角色成长与等级设计','经验曲线、生命周期、追赶与长期通胀'],
['03_系统设计/装备与道具设计-从随机词缀到强化经济.md','系统','装备与道具设计','从随机词缀、强化成本到装备经济循环'],
['03_系统设计/技能与天赋设计-从单技能价值到Build多样性.md','系统','技能与天赋设计','技能循环、连携网络与 Build 多样性'],
['05_数值与经济/游戏数值策划教程-章节凝练索引.md','资料','教程章节凝练索引','17 章知识地图与阅读路线'],
['99_资料来源/游戏数值策划完全教程-资料卡.md','资料','《游戏数值策划完全教程》资料卡','来源、可信度、版权边界与交叉核验清单'],
['游戏设计资料索引.md','资料','第一轮互联网资料索引','游戏设计理论、经济、关卡、叙事与 UX 来源地图']];
const cards=document.querySelector('#cards'),reader=document.querySelector('#reader'),heading=document.querySelector('#heading'),selectNote=document.querySelector('#selectNote'),noteModal=document.querySelector('#noteModal'),noteDrawer=document.querySelector('#noteDrawer');let filter='全部',currentFile='',pendingSelection=null;
const NOTE_KEY='game-design-annotations-v1';
function allNotes(){try{return JSON.parse(localStorage.getItem(NOTE_KEY)||'[]')}catch{return[]}}
function saveAllNotes(notes){localStorage.setItem(NOTE_KEY,JSON.stringify(notes))}
function articleNotes(){return allNotes().filter(n=>n.file===currentFile)}
function draw(){let q=document.querySelector('#search').value.toLowerCase();cards.innerHTML=files.filter(x=>(filter==='全部'||x[1]===filter)&&(!q||x[2].toLowerCase().includes(q)||x[3].toLowerCase().includes(q))).map((x,i)=>`<div class="card" data-file="${encodeURIComponent(x[0])}"><div><span class="tag">${x[1]} / NOTE ${String(i+1).padStart(2,'0')}</span><h3>${x[2]}</h3><p>${x[3]}</p></div><small>READ ARTICLE ↗</small></div>`).join('');document.querySelectorAll('.card').forEach(c=>c.onclick=()=>openArticle(decodeURIComponent(c.dataset.file)))}
async function openArticle(file){currentFile=file;cards.hidden=true;document.querySelector('.toolbar').hidden=true;reader.hidden=false;reader.innerHTML='<button class="back">← BACK TO INDEX</button><p>Loading…</p>';let r=await fetch(encodeURI(file));let text=await r.text();text=text.replace(/^---[\s\S]*?---\s*/,'');reader.innerHTML='<button class="back">← BACK TO INDEX</button><div class="note-tools"><button id="showNotes">查看批注</button><button id="exportNotes">导出给作者</button><button id="importNotes">导入批注</button><span id="noteCount" class="note-count"></span></div>'+marked.parse(text);if(window.renderMathInElement){renderMathInElement(reader,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false})}reader.querySelector('.back').onclick=closeArticle;reader.querySelector('#showNotes').onclick=openDrawer;reader.querySelector('#exportNotes').onclick=exportNotes;reader.querySelector('#importNotes').onclick=()=>document.querySelector('#noteImport').click();refreshNotes();window.scrollTo({top:0,behavior:'smooth'})}
function closeArticle(){currentFile='';selectNote.hidden=true;noteDrawer.hidden=true;reader.hidden=true;cards.hidden=false;document.querySelector('.toolbar').hidden=false;if(CSS.highlights)CSS.highlights.delete('game-notes')}
function textMap(){let nodes=[],text='',walker=document.createTreeWalker(reader,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('.note-tools,.back,button,script,style')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});while(walker.nextNode()){nodes.push({node:walker.currentNode,start:text.length,end:text.length+walker.currentNode.data.length});text+=walker.currentNode.data}return{nodes,text}}
function rangeAt(start,end,map){let a=map.nodes.find(x=>x.start<=start&&x.end>=start),b=map.nodes.find(x=>x.start<end&&x.end>=end);if(!a||!b)return null;let range=new Range();range.setStart(a.node,start-a.start);range.setEnd(b.node,end-b.start);return range}
function rangeOffsets(range,map){let a=map.nodes.find(x=>x.node===range.startContainer),b=map.nodes.find(x=>x.node===range.endContainer);return a&&b?{start:a.start+range.startOffset,end:b.start+range.endOffset}:null}
function findNoteRange(note,map){let candidates=[],at=map.text.indexOf(note.quote);while(at!==-1){candidates.push(at);at=map.text.indexOf(note.quote,at+1)}if(!candidates.length)return null;let best=candidates.sort((a,b)=>{let sa=(map.text.slice(Math.max(0,a-note.prefix.length),a)===note.prefix?2:0)+(map.text.slice(a+note.quote.length,a+note.quote.length+note.suffix.length)===note.suffix?2:0);let sb=(map.text.slice(Math.max(0,b-note.prefix.length),b)===note.prefix?2:0)+(map.text.slice(b+note.quote.length,b+note.quote.length+note.suffix.length)===note.suffix?2:0);return sb-sa})[0];return rangeAt(best,best+note.quote.length,map)}
function refreshNotes(){let notes=articleNotes(),count=reader.querySelector('#noteCount');if(count)count.textContent=`${notes.length} 条批注`;if(CSS.highlights){let map=textMap(),ranges=notes.map(n=>findNoteRange(n,map)).filter(Boolean);CSS.highlights.set('game-notes',new Highlight(...ranges))}renderNoteList(notes)}
function renderNoteList(notes){let list=document.querySelector('#noteList');list.innerHTML=notes.length?notes.map(n=>`<section class="note-item" data-id="${n.id}"><blockquote>${escapeHtml(n.quote)}</blockquote><p>${escapeHtml(n.note)}</p><div class="note-actions"><button data-action="locate">定位</button><button data-action="edit">修改</button><button data-action="delete">删除</button></div></section>`).join(''):'<p>这篇文章还没有批注。</p>';list.querySelectorAll('button').forEach(b=>b.onclick=()=>noteAction(b.closest('.note-item').dataset.id,b.dataset.action))}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openDrawer(){noteDrawer.hidden=false;refreshNotes()}
function noteAction(id,action){let notes=allNotes(),note=notes.find(n=>n.id===id);if(!note)return;if(action==='delete'){if(confirm('删除这条批注？')){saveAllNotes(notes.filter(n=>n.id!==id));refreshNotes()}return}if(action==='edit'){let value=prompt('修改批注：',note.note);if(value!==null&&value.trim()){note.note=value.trim();note.updatedAt=new Date().toISOString();saveAllNotes(notes);refreshNotes()}return}let range=findNoteRange(note,textMap());if(range){let box=range.getBoundingClientRect();window.scrollTo({top:scrollY+box.top-130,behavior:'smooth'});noteDrawer.hidden=true}}
reader.addEventListener('mouseup',()=>setTimeout(()=>{let sel=getSelection();if(!currentFile||sel.isCollapsed||!reader.contains(sel.anchorNode)||!reader.contains(sel.focusNode)){selectNote.hidden=true;return}let quote=sel.toString().trim();if(!quote){selectNote.hidden=true;return}let range=sel.getRangeAt(0),map=textMap(),pos=rangeOffsets(range,map),start=pos?pos.start:map.text.indexOf(quote),end=pos?pos.end:start+quote.length;let box=range.getBoundingClientRect();pendingSelection={quote,prefix:start>=0?map.text.slice(Math.max(0,start-40),start):'',suffix:end>=0?map.text.slice(end,end+40):''};selectNote.style.left=Math.min(innerWidth-100,Math.max(8,box.left+box.width/2-38))+'px';selectNote.style.top=Math.max(8,box.top-45)+'px';selectNote.hidden=false},0));
selectNote.onclick=()=>{if(!pendingSelection)return;document.querySelector('#selectedQuote').textContent=pendingSelection.quote;document.querySelector('#noteText').value='';noteModal.showModal();selectNote.hidden=true;setTimeout(()=>document.querySelector('#noteText').focus(),50)};
document.querySelector('#saveNote').onclick=e=>{let note=document.querySelector('#noteText').value.trim();if(!note){e.preventDefault();return}let notes=allNotes();notes.push({id:crypto.randomUUID(),file:currentFile,...pendingSelection,note,createdAt:new Date().toISOString()});saveAllNotes(notes);getSelection().removeAllRanges();refreshNotes()};
document.querySelector('#closeDrawer').onclick=()=>noteDrawer.hidden=true;
function exportNotes(){let notes=articleNotes();if(!notes.length){alert('这篇文章还没有批注。');return}let payload={format:'game-design-annotations',version:1,article:currentFile,exportedAt:new Date().toISOString(),annotations:notes};let blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='游戏设计批注-'+currentFile.split('/').pop().replace(/\.md$/,'')+'.json';a.click();URL.revokeObjectURL(a.href)}
document.querySelector('#noteImport').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let payload=JSON.parse(await f.text());if(payload.format!=='game-design-annotations'||!Array.isArray(payload.annotations))throw Error();let existing=allNotes(),ids=new Set(existing.map(n=>n.id));for(let n of payload.annotations)if(!ids.has(n.id))existing.push(n);saveAllNotes(existing);refreshNotes();alert('批注已导入。')}catch{alert('不是有效的批注文件。')}e.target.value=''};
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;heading.textContent=filter==='全部'?'所有文章':filter+'相关';draw()});document.querySelector('#search').oninput=draw;draw();
</script></body></html>
